<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 — A Vida que Quero Construir</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root{--bg:#f6f1e7;--card:#fffdf8;--sand:#e9dfca;--sage:#8b9b7c;--pine:#2f4a3c;--terra:#bf7b64;--rose:#d9aa9c;--ink:#3a3029;--mut:#7d7062;--r:22px;--sh:0 6px 24px rgba(70,55,35,.07)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Nunito Sans',system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
aside{width:250px;padding:28px 20px;position:sticky;top:0;height:100vh;background:var(--sand);display:flex;flex-direction:column;gap:6px;overflow:auto}
aside .logo{font-family:'Fraunces',Georgia,serif;font-size:1.5rem;line-height:1.1;margin-bottom:18px;color:var(--pine)}
aside .logo small{display:block;font:italic 400 .85rem 'Fraunces',serif;color:var(--mut);margin-top:4px}
.nv{background:none;border:0;text-align:left;padding:10px 14px;border-radius:14px;cursor:pointer;color:var(--ink);transition:.2s}
.nv:hover{background:#f0e8d6}.nv.on{background:var(--pine);color:#fff}
.bk{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:16px}
main{flex:1;padding:36px clamp(16px,4vw,52px) 80px;max-width:1180px}
.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.hero{padding:34px 36px;background:var(--pine);color:#f6f1e7;border-radius:28px;position:relative;overflow:hidden;margin-bottom:22px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:var(--sage);opacity:.35}
.hero h1{font-size:clamp(1.7rem,4vw,2.5rem);position:relative}.hero p{position:relative;opacity:.9;max-width:560px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-size:.85rem;margin:10px 8px 10px 0;position:relative}
.hero .ph{font-family:'Fraunces',serif;font-style:italic;font-size:1.2rem;margin-top:8px}
.big{font-family:'Fraunces',serif;font-size:2.1rem;line-height:1.1;color:var(--pine)}.sm{font-size:.88rem;color:var(--mut)}
h2{font-size:1.5rem;margin:30px 0 14px}h3{font-size:1.15rem;margin-bottom:8px}
.bar{height:9px;background:var(--sand);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:var(--sage);transition:width .6s}
.btn{border:0;border-radius:99px;padding:9px 18px;cursor:pointer;background:var(--pine);color:#fff;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.s{background:var(--sand);color:var(--ink)}.btn.t{background:none;color:var(--terra);padding:6px 10px}.btn.xs{padding:5px 12px;font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chip{border:0;background:var(--sand);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:.9rem}.chip.on{background:var(--terra);color:#fff}
.pc{cursor:pointer;transition:.25s;border-top:5px solid var(--c)}.pc:hover{transform:translateY(-3px)}
.tag{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--sand);color:var(--mut)}.tag.neu{background:#efe2cc;color:#8a6a45}
.ov{position:fixed;inset:0;background:rgba(58,48,41,.45);display:flex;justify-content:center;align-items:flex-start;padding:30px 14px;overflow:auto;z-index:9;animation:f .2s}
@keyframes f{from{opacity:0}}
.mod{background:var(--card);border-radius:26px;padding:28px;width:min(560px,100%);display:grid;gap:12px}
label{font-size:.88rem;color:var(--mut);display:grid;gap:4px}
input,select,textarea{border:1.5px solid var(--sand);background:#fff;border-radius:12px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sage);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--pine);color:#fff;padding:10px 22px;border-radius:99px;transition:.35s;z-index:20}#toast.on{transform:translateX(-50%)}
.ch{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}.ch div{flex:1;text-align:center;font-size:.68rem;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.ch b{display:block;background:var(--sage);border-radius:8px 8px 3px 3px;min-height:2px}.ch b.neg{background:var(--rose)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:.75rem;color:var(--mut)}
.dy{border:1.5px solid var(--sand);background:#fff;border-radius:12px;padding:8px 0;cursor:pointer}.dy.on{background:var(--sage);border-color:var(--sage);color:#fff}
.tl{border-left:2px solid var(--sand);padding-left:18px;margin-left:6px}.tl .it{position:relative;padding:6px 0 12px}.tl .it:before{content:"";position:absolute;left:-25px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--terra)}
.scrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.scrap .card{transform:rotate(-1deg);background:#fbf3e4}.scrap .card:nth-child(even){transform:rotate(1.2deg);background:#f4ebe0}
.tk{display:flex;gap:8px;align-items:center;padding:4px 0}.tk input{width:auto}
.empty{color:var(--mut);font-style:italic;padding:10px 0}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:14px}aside .logo{width:100%;margin:0}.bk{flex-direction:row;margin:0;padding:0;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside id="nav"></aside>
<main id="app"></main>
<div id="md"></div><div id="toast"></div>
<input type="file" id="imp" accept=".json" hidden>
<script>
/* ================= DADOS BASE ================= */
const KEY='vida2027';
const PIL=[
 {id:'saude',n:'Saúde',t:'Construir energia e vitalidade',d:'Construir um corpo mais forte, ativo e saudável. Recuperar minha energia, melhorar meu condicionamento e desenvolver uma rotina sustentável de cuidado.',c:'#8b9b7c',i:'🌿'},
 {id:'carreira',n:'Carreira',t:'Transformar competência em reconhecimento e oportunidade',d:'Deixar de apenas ser reconhecida pela minha capacidade de entregar e passar a posicionar meu trabalho, minha expertise e minha liderança para alcançar um novo patamar profissional.',c:'#2f4a3c',i:'💼'},
 {id:'estudos',n:'Estudos',t:'Construir um projeto intelectual que tenha futuro',d:'Construir uma base teórica sólida, aprofundar meu conhecimento e desenvolver meu projeto de pesquisa para o mestrado.',c:'#b59a6d',i:'📚'},
 {id:'financas',n:'Finanças',t:'Assumir o controle e construir patrimônio',d:'Sair do modo de administrar urgências e entrar no modo de construir segurança e patrimônio.',c:'#a58b5e',i:'🪙'},
 {id:'emocional',n:'Vida emocional',t:'Autonomia, limites e relações recíprocas',d:'Cuidar sem me sacrificar. Amar sem me abandonar. Estar presente sem assumir o papel de responsável por tudo.',c:'#bf7b64',i:'🕊️'},
 {id:'aventura',n:'Aventura e criatividade',t:'Expandir a vida para além das obrigações',d:'Viajar, explorar, criar, conhecer e viver experiências que me façam sentir viva.',c:'#d9aa9c',i:'🧭'}];
// [nome, prazo, prioridade, etapas]
const SEED={
 saude:[['Manter atividade física durante o ano'],['Consolidar rotina de 3 a 4 treinos semanais, evoluindo gradualmente'],['Melhorar condicionamento cardiovascular e força'],['Priorizar sono e qualidade do descanso'],['Fazer acompanhamento preventivo da saúde','2027-06-30'],['Buscar evolução de peso e composição corporal de forma gradual e saudável (se ainda fizer sentido)','2027-12-31','baixa']],
 carreira:[['Definir o próximo nível profissional que desejo alcançar','2027-03-31'],['Buscar promoção, posição de maior responsabilidade ou oportunidade melhor','2027-12-31'],['Atualizar CV e LinkedIn até março','2027-03-31'],['Identificar oportunidades externas sem agir impulsivamente'],['Desenvolver ao menos uma competência técnica ou estratégica de alto valor'],['Registrar projetos, resultados, indicadores e impactos do meu trabalho'],['Participar de eventos, ampliar networking e visibilidade','2027-12-31','média']],
 estudos:[['Consolidar a base teórica necessária para o mestrado'],['Construir uma rotina de leitura acadêmica (mín. 2 textos/mês)'],['Estudar sociologia clássica e contemporânea'],['Desenvolver o tema e a pergunta central da pesquisa','2027-06-30'],['Produzir fichamentos (1 por texto)'],['Elaborar uma versão estruturada do projeto'],['Projeto Mestrado — etapas','2027-12-31','alta',['Definição do tema','Delimitação do problema','Pergunta de pesquisa','Revisão bibliográfica','Referencial teórico','Metodologia','Estrutura do projeto','Revisão','Preparação para seleção','Inscrição','Entrevista / etapas do processo seletivo']],['Preparar-me para o processo seletivo de mestrado em 2027']],
 financas:[['Fazer diagnóstico financeiro completo','2027-03-31','alta'],['Criar plano de redução ou negociação das dívidas'],['Construir ou fortalecer reserva de emergência'],['Criar orçamento mensal realista'],['Reduzir gastos impulsivos'],['Destinar recursos a viagens e projetos'],['Avaliar possibilidades de aumento de renda']],
 emocional:[['Não assumir responsabilidade pelas emoções e problemas de outras pessoas'],['Parar de medir meu valor pela quantidade de pessoas que precisam de mim'],['Praticar limites sem justificar excessivamente'],['Não insistir em relações que exigem que eu me abandone'],['Cultivar relações recíprocas'],['Desenvolver autonomia emocional'],['Ter interesses, atividades e momentos exclusivamente meus']],
 aventura:[['Realizar pelo menos uma grande viagem ou aventura'],['Experimentar uma atividade nova'],['Desenvolver um hobby criativo'],['Escrever mais'],['Conhecer lugares, pessoas e perspectivas'],['Ter experiências sem relação com trabalho ou obrigação']]};
const HAB0=[['Exercício físico',3],['Leitura',3],['Estudo',3],['Alongamento',3],['Dormir em horário adequado',5],['Autocuidado',3],['Diário',2]];
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){let id=0;return{goals:PIL.flatMap(p=>SEED[p.id].map(g=>({id:uid(),pil:p.id,name:g[0],desc:'',deadline:g[1]||'2027-12-31',prio:g[2]||'média',status:'não iniciada',progress:0,next:'',start:'',end:'',notes:'',tasks:(g[3]||[]).map(t=>({t,done:false})),hist:[]}))),
 habits:HAB0.map(h=>({id:uid(),name:h[0],target:h[1]})),hl:{},months:{},quarters:{},journal:[],recs:[]}}
let S=JSON.parse(localStorage.getItem(KEY)||'null')||seed();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
/* ================= UTILIDADES ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY=iso(new Date());
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const fd=d=>d?d.split('-').reverse().join('/'):'';
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)};
const P=id=>PIL.find(p=>p.id===id)||PIL[0];
const gp=g=>g.tasks&&g.tasks.length?Math.round(g.tasks.filter(t=>t.done).length/g.tasks.length*100):+g.progress||0;
const late=g=>g.status!=='concluída'&&g.deadline&&g.deadline<TODAY;
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const pilProg=id=>avg(S.goals.filter(g=>g.pil===id).map(gp));
const mondayOf=(off=0)=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d};
const weekDates=off=>[...Array(7)].map((_,i)=>{const d=mondayOf(off);d.setDate(d.getDate()+i);return iso(d)});
const monthKey=()=>TODAY.startsWith('2027')?TODAY.slice(0,7):'2027-01';
const phase=()=>TODAY<'2027-03-30'?7:8;
const yearPct=()=>{const a=new Date('2027-01-01'),b=new Date('2027-12-31'),n=new Date();return Math.max(0,Math.min(100,Math.round((n-a)/(b-a)*100)))};
const activeDays=()=>{const s=new Set();S.recs.forEach(r=>r.date&&s.add(r.date));S.journal.forEach(j=>s.add(j.date));Object.values(S.hl).forEach(o=>Object.keys(o).forEach(d=>s.add(d)));return s.size};
const bars=(vals,labs,fmt=v=>v)=>{const m=Math.max(1,...vals.map(Math.abs));return`<div class="ch">${vals.map((v,i)=>`<div title="${esc(fmt(v))}"><b class="${v<0?'neg':''}" style="height:${Math.abs(v)/m*85}%"></b>${labs[i]}</div>`).join('')}</div>`};
/* ================= FORMULÁRIO MODAL GENÉRICO ================= */
// campos: [chave, rótulo, tipo, opções, obrigatório]
function openForm(title,fields,v,cb){
 const inp=([k,l,t,o,req])=>{const val=esc(v[k]??'');
  const el=t==='textarea'?`<textarea name="${k}">${val}</textarea>`:t==='select'?`<select name="${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}" ${a==v[k]?'selected':''}>${esc(b)}</option>`}).join('')}</select>`
  :t==='range'?`<input type="range" name="${k}" min="0" max="${o||100}" value="${val||0}">`:`<input type="${t||'text'}" name="${k}" value="${val}" ${t==='number'?'step="any"':''}>`;
  return`<label>${esc(l)}${req?' *':''}${el}</label>`};
 $('#md').innerHTML=`<div class="ov"><form class="mod"><h2 style="margin:0">${esc(title)}</h2>${fields.map(inp).join('')}<div class="row sp"><button type="button" class="btn s" id="cx">Cancelar</button><button class="btn">Salvar</button></div></form></div>`;
 $('#cx').onclick=()=>$('#md').innerHTML='';
 $('.mod').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o={};
  for(const[k,l,,,req] of fields){o[k]=(f.get(k)||'').toString().trim();if(req&&!o[k]){toast('Preencha: '+l);return}}
  cb(o);save();$('#md').innerHTML='';toast('Salvo ✓');render()}}
/* ================= REGISTROS POR PILAR (trackers) ================= */
const sel=(...a)=>a;
const R={
 saude:{l:'Treinos',b:'Registrar treino',f:[['date','Data','date',0,1],['tipo','Atividade','text',0,1],['min','Duração (minutos)','number'],['int','Intensidade (opcional)','select',['','leve','moderada','intensa']],['obs','Observações','textarea']],t:r=>`${r.tipo} · ${r.min||0} min${r.int?' · '+r.int:''}`,v:r=>+r.min||0,u:' min',h:'Minutos ativos por mês'},
 carreira:{l:'Portfólio de conquistas 2027',b:'Nova conquista',f:[['title','Título','text',0,1],['date','Data','date',0,1],['ctx','Contexto','textarea'],['fiz','O que eu fiz','textarea'],['res','Resultado','textarea'],['imp','Impacto','textarea'],['comp','Competências demonstradas','text']],t:r=>r.title,v:()=>1,u:'',h:'Conquistas por mês'},
 estudos:{l:'Leituras e estudos',b:'Registrar leitura',f:[['title','Título','text',0,1],['aut','Autor','text'],['tema','Tema','text'],['date','Data','date',0,1],['st','Status','select',['planejado','lendo','lido','fichado']],['h','Horas estudadas','number'],['nota','Avaliação pessoal (0–10, opcional)','number'],['ideias','Principais ideias / notas','textarea'],['tags','Tags (separadas por vírgula)','text']],t:r=>`${r.title} — ${r.aut||'s/ autor'} (${r.st})`,v:()=>1,u:' texto(s)',h:'Leituras por mês (meta: 2)'},
 financas:{l:'Lançamentos',b:'Novo lançamento',f:[['date','Data','date',0,1],['tipo','Tipo','select',['receita','despesa','aporte']],['cat','Categoria','select',['Moradia','Alimentação','Saúde','Pets','Transporte','Lazer','Viagens','Estudos','Compras','Dívidas','Investimentos','Outros']],['valor','Valor (R$)','number',0,1],['desc','Descrição','text']],t:r=>`${r.tipo} · ${r.cat} · ${brl(r.valor)} ${r.desc?'— '+r.desc:''}`,v:r=>r.tipo==='receita'?+r.valor:-(+r.valor),u:'',h:'Saldo do mês (receitas − despesas − aportes)'},
 emocional:{l:'Check-ins emocionais',b:'Novo check-in',f:[['date','Data','date',0,1],['humor','Humor (1–10)','range',10],['en','Energia (1–10)','range',10],['ans','Ansiedade/estresse (1–10, opcional)','number'],['bem','O que me fez bem hoje?','textarea'],['dren','O que drenou minha energia?','textarea'],['eu','Algo que fiz por mim','text'],['lim','Algum limite que consegui estabelecer?','text'],['prec','O que preciso neste momento?','textarea']],t:r=>`Humor ${r.humor} · Energia ${r.en}${r.bem?' — '+r.bem:''}`,v:r=>+r.humor||0,avg:1,u:'',h:'Humor médio por mês (1–10)'},
 aventura:{l:'2027 — Things that made me feel alive',b:'Nova memória',f:[['title','Título','text',0,1],['cat','Categoria','select',['Viagem','Passeio','Experiência nova','Evento','Livro','Filme','Show','Atividade criativa','Momento memorável','Alegria']],['date','Data','date',0,1],['desc','Descrição','textarea'],['nota','Nota da experiência (opcional)','number'],['sent','Como me senti?','text']],t:r=>`${r.title} (${r.cat})`,v:()=>1,u:'',h:'Experiências por mês'}};
function recChart(p){const d=R[p],rs=S.recs.filter(r=>r.p===p&&(r.date||'').startsWith('2027'));
 const vals=MES.map((_,i)=>{const k='2027-'+String(i+1).padStart(2,'0'),a=rs.filter(r=>r.date.startsWith(k));if(p==='financas')return a.reduce((s,r)=>s+(r.tipo==='receita'?+r.valor:-(+r.valor)),0);const x=a.map(d.v);return d.avg?(x.length?+(x.reduce((s,y)=>s+y,0)/x.length).toFixed(1):0):x.reduce((s,y)=>s+y,0)});
 return`<p class="sm">${d.h} — apenas registros datados em 2027</p>`+bars(vals,MES.map(m=>m[0]),v=>String(v))}
function recPanel(p){const d=R[p],rs=S.recs.filter(r=>r.p===p).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 let extra='';
 if(p==='financas'){const mk=monthKey(),a=S.recs.filter(r=>r.p==='financas'&&(r.date||'').startsWith(mk)),s=t=>a.filter(r=>r.tipo===t).reduce((x,r)=>x+ +r.valor,0);
  extra=`<div class="row" style="margin:10px 0"><span class="tag">Receitas ${brl(s('receita'))}</span><span class="tag">Despesas ${brl(s('despesa'))}</span><span class="tag">Aportes ${brl(s('aporte'))}</span><span class="tag neu">Saldo ${brl(s('receita')-s('despesa')-s('aporte'))}</span><span class="sm">(${MES[+mk.slice(5)-1]})</span></div>`}
 const item=r=>`<div class="row sp" style="padding:8px 0;border-top:1px solid var(--sand)"><div><span class="sm">${fd(r.date)}</span> ${esc(d.t(r))}${r.obs||r.ideias||r.res?`<div class="sm">${esc(r.obs||r.ideias||r.res)}</div>`:''}</div><div><button class="btn t xs" data-a="redit" data-id="${r.id}">Editar</button><button class="btn t xs" data-a="rdel" data-id="${r.id}">Excluir</button></div></div>`;
 const body=p==='aventura'?`<div class="scrap">${rs.map(r=>`<div class="card"><div class="sm">${fd(r.date)} · ${esc(r.cat)}</div><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p>${r.sent?`<p class="sm">Senti: <i>${esc(r.sent)}</i></p>`:''}<button class="btn t xs" data-a="redit" data-id="${r.id}">Editar</button><button class="btn t xs" data-a="rdel" data-id="${r.id}">Excluir</button></div>`).join('')}</div>`:rs.map(item).join('');
 return`<h2>${d.l}</h2><div class="card"><div class="row sp"><span class="sm">${rs.length} registro(s)</span><button class="btn" data-a="rnew" data-p="${p}">+ ${d.b}</button></div>${extra}${recChart(p)}<div style="margin-top:14px">${body||'<p class="empty">Nada registrado ainda — comece quando quiser.</p>'}</div></div>`}
/* ================= VIEWS ================= */
let V='dash',PF='',FL='todas',MK=monthKey(),WO=0,JQ='',JT='',JM='';
const MSG=['Cada movimento conta.','Você está construindo consistência, não perfeição.','Descansar também faz parte do processo.','Você não precisa resolver tudo hoje.','Um dia difícil não anula sua evolução.','Seu valor não depende da sua utilidade para alguém.'];
function vDash(){
